name: Create Release

# Fallback release creation for raw tag pushes. The documented /release flow
# creates the release manually (gh release create, curated notes) — when that
# release already exists for the tag, this workflow leaves it untouched.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches pyproject version
        run: |
          PYVER=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PYVER" != "$TAG" ]; then
            echo "::error::pyproject.toml version ($PYVER) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $GITHUB_REF_NAME already exists (manual /release flow) — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release (fallback with auto-generated notes)
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
