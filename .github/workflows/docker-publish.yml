name: Docker Build and Publish

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Superseded branch/PR runs cancel; tag (release) builds always run to completion
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/test.yml

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: tests
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify tag matches pyproject version
        if: github.ref_type == 'tag'
        run: |
          PYVER=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PYVER" != "$TAG" ]; then
            echo "::error::pyproject.toml version ($PYVER) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: slug
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Determine branch name
        id: branch
        run: |
          # For tags, use 'main' as the branch (stable release)
          # For branches, use the actual branch name
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=main" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: a transient GHA cache-export hiccup ("error writing
          # layer blob: not_found") must not fail a build whose image already
          # built and pushed successfully — the cache is an optimization, not a
          # gate.
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_BRANCH=${{ steps.branch.outputs.name }}
            GIT_SHA=${{ steps.slug.outputs.sha_short }}

      - name: Image digest
        run: echo ${{ steps.build-push.outputs.digest }}
