name: Tests

# Branch pushes are tested via the Docker Build and Publish workflow, which
# calls this workflow as its gate (workflow_call) — no duplicate runs.
on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Lint & test backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check teamarr/ tests/

      - name: Pytest
        run: uv run pytest tests/ -q

  typecheck:
    name: Pyright (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Non-blocking: 401-error baseline as of 2026-07 (iua3.10). Tighten to a
    # blocking gate once the baseline is burned down.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Pyright
        run: uv run pyright teamarr/

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  frontend-lint:
    name: ESLint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-blocking: 67-error baseline as of 2026-07 (#280), mostly
    # react-hooks/immutability. Tighten to a blocking gate once the
    # baseline is burned down.
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
