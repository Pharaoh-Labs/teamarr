name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["type: bug", "status: needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Tag / Commit
      description: "Docker tag or commit hash (e.g., latest, v2.4.3, dev@abc1234)"
      placeholder: "latest or v2.4.3 or dev@abc1234"
    validations:
      required: true

  - type: input
    id: dispatcharr_version
    attributes:
      label: Dispatcharr version
      description: "Dispatcharr version Teamarr is connected to (e.g., 0.24.0). Several features are gated on the Dispatcharr version."
      placeholder: "e.g., 0.24.0"
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: "Only if the bug is in the UI. Include the version if you can."
      placeholder: "e.g., Firefox 128, Chrome 126, Safari 17"

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Teamarr is this about?
      options:
        - Not sure
        - Generation / EPG output
        - Matching
        - Sources
        - Dispatcharr sync
        - Templates
        - Settings
        - Frontend / UI
        - Other

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here
