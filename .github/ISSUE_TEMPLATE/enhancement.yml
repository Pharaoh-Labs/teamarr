name: Enhancement
description: Improve an existing feature
title: "[Enhancement]: "
labels: ["type: enhancement", "status: needs-triage"]
body:
  - type: textarea
    id: current
    attributes:
      label: Current behavior
      placeholder: How it works now
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Proposed improvement
      placeholder: How it should work instead
    validations:
      required: true

  - type: textarea
    id: benefit
    attributes:
      label: Why?
      placeholder: What's the benefit?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Teamarr is this about?
      options:
        - Not sure
        - Generation / EPG output
        - Matching
        - Sources
        - Dispatcharr sync
        - Templates
        - Settings
        - Frontend / UI
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, examples
