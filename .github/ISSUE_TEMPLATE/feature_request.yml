name: Feature Request
description: Suggest a new feature
title: "[Feature]: "
labels: ["type: feature", "status: needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use case
      placeholder: What are you trying to accomplish?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: How should it work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Other approaches you've thought about

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of Teamarr is this about?
      options:
        - Not sure
        - Generation / EPG output
        - Matching
        - Sources
        - Dispatcharr sync
        - Templates
        - Settings
        - Frontend / UI
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, examples
